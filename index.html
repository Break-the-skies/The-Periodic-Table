<!DOCTYPE html>
<html>
<head>
    <title>The Periodic Table (of Elements)</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.jss"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Your guide to the Periodic Table!</h1>
    <h3>Below is an interactive table.</h3>
    <div id="Interactive_Table" class="grid-container">
        <div id="Main_Elements" class="grid-item">
            <div id="Row 1" class="row">
                <button type="button" class="Non-metal" id="H">H</button>
                <button style="grid-column: 2 / span 16;" id="H-He_Gap"></button>
                <button type="button" class="Noble gas" id="He">He</button>
            </div>
            <div id="Row 2" class="row">
                <button type="button" class="Alkali metal" id="Li">Li</button>
                <button type="button" class="Alkali earth metal" id="Be">Be</button>
                <button style="grid-column: 3 / span 14;" id="Be-B_Gap"></button>
                <button type="button" class="Metalloid" id="B">B</button>
                <button type="button" class="Non-metal" id="C">C</button>
                <button type="button" class="Non-metal" id="N">N</button>
                <button type="button" class="Non-metal" id="O">O</button>
                <button type="button" class="Halogen" id="F">F</button>
                <button type="button" class="Noble gas" id="Ne">Ne</button>
            </div>
            <div id="Row 3" class="row">
                <button type="button" class="Alkali metal" id="Na">Na</button>
                <button type="button" class="Alkali earth metal" id="Mg">Mg</button>
                <button style="grid-column: 3 / span 14;" id="Mg-Al_Gap"></button>
                <button type="button" class="Post-transition metal" id="Al">Al</button>
                <button type="button" class="Metalloid" id="Si">Si</button>
                <button type="button" class="Non-metal" id="P">P</button>
                <button type="button" class="Non-metal" id="S">S</button>
                <button type="button" class="Halogen" id="Cl">Cl</button>
                <button type="button" class="Noble gas" id="Ar">Ar</button>
            </div>
            <div id="Row 4" class="row">
                <button type="button" class="Alkali metal" id="K">K</button>
                <button type="button" class="Alkali earth metal" id="Ca">Ca</button>
                <button type="button" class="Transition metal" id="Sc">Sc</button>
                <button type="button" class="Transition metal" id="Ti">Ti</button>
                <button type="button" class="Transition metal" id="V">V</button>
                <button type="button" class="Transition metal" id="Cr">Cr</button>
                <button type="button" class="Transition metal" id="Mn">Mn</button>
                <button type="button" class="Transition metal" id="Fe">Fe</button>
                <button type="button" class="Transition metal" id="Co">Co</button>
                <button type="button" class="Transition metal" id="Ni">Ni</button>
                <button type="button" class="Transition metal" id="Cu">Cu</button>
                <button type="button" class="Transition metal" id="Zn">Zn</button>
                <button type="button" class="Post-transition metal" id="Ga">Ga</button>
                <button type="button" class="Metalloid" id="Ge">Ge</button>
                <button type="button" class="Metalloid" id="As">As</button>
                <button type="button" class="Non-metal" id="Se">Se</button>
                <button type="button" class="Halogen" id="Br">Br</button>
                <button type="button" class="Noble gas" id="Kr">Kr</button>
            </div>
            <div id="Row 5" class="row">
                <button type="button" class="Alkali metal" id="Rb">Rb</button>
                <button type="button" class="Alkali earth metal" id="Sr">Sr</button>
                <button type="button" class="Transition metal" id="Y">Y</button>
                <button type="button" class="Transition metal" id="Zr">Zr</button>
                <button type="button" class="Transition metal" id="Nb">Nb</button>
                <button type="button" class="Transition metal" id="Mo">Mo</button>
                <button type="button" class="Transition metal" id="Tc">Tc</button>
                <button type="button" class="Transition metal" id="Ru">Ru</button>
                <button type="button" class="Transition metal" id="Rh">Rh</button>
                <button type="button" class="Transition metal" id="Pd">Pd</button>
                <button type="button" class="Transition metal" id="Ag">Ag</button>
                <button type="button" class="Transition metal" id="Cd">Cd</button>
                <button type="button" class="Post-transition metal" id="In">In</button>
                <button type="button" class="Post-transition metal" id="Sn">Sn</button>
                <button type="button" class="Metalloid" id="Sb">Sb</button>
                <button type="button" class="Metalloid" id="Te">Te</button>
                <button type="button" class="Halogen" id="I">I</button>
                <button type="button" class="Noble gas" id="Xe">Xe</button>
            </div>
            <div id="Row 6" class="Row">
                <button type="button" class="Alkali metal" id="Cs">Cs</button>
                <button type="button" class="Alkali earth metal" id="Ba">Ba</button>
                <button type="button" class="Transition metal" id="La">La</button>
                <button type="button" class="Transition metal" id="Hf">Hf</button>
                <button type="button" class="Transition metal" id="Ta">Ta</button>
                <button type="button" class="Transition metal" id="W">W</button>
                <button type="button" class="Transition metal" id="Re">Re</button>
                <button type="button" class="Transition metal" id="Os">Os</button>
                <button type="button" class="Transition metal" id="Ir">Ir</button>
                <button type="button" class="Transition metal" id="Pt">Pt</button>
                <button type="button" class="Transition metal" id="Au">Au</button>
                <button type="button" class="Transition metal" id="Hg">Hg</button>
                <button type="button" class="Post-transition metal" id="Tl">Tl</button>
                <button type="button" class="Post-transition metal" id="Pb">Pb</button>
                <button type="button" class="Post-transition metal" id="Bi">Bi</button>
                <button type="button" class="Metalloid" id="Po">Po</button>
                <button type="button" class="Halogen" id="At">At</button>
                <button type="button" class="Noble gas" id="Rn">Rn</button>
            </div>
            <div id="Row 7" class="Row">
                <button type="button" class="Alkali metal" id="Fr">Fr</button>
                <button type="button" class="Alkali earth metal" id="Ra">Ra</button>
                <button type="button" class="Transition metal" id="Ac">Ac</button>
                <button type="button" class="Transition metal" id="Rf">Rf</button>
                <button type="button" class="Transition metal" id="Db">Db</button>
                <button type="button" class="Transition metal" id="Sg">Sg</button>
                <button type="button" class="Transition metal" id="Bh">Bh</button>
                <button type="button" class="Transition metal" id="Hs">Hs</button>
                <button type="button" class="Transition metal" id="Mt">Mt</button>
                <button type="button" class="Transition metal" id="Ds">Ds</button>
                <button type="button" class="Transition metal" id="Rb">Rg</button>
                <button type="button" class="Transition metal" id="Cn">Cn</button>
                <button type="button" class="Post-transition metal" id="Nh">Nh</button>
                <button type="button" class="Post-transition metal" id="Fl">Fl</button>
                <button type="button" class="Post-transition metal" id="Mc">Mc</button>
                <button type="button" class="Post-transition metal" id="Lv">Lv</button>
                <button type="button" class="Halogen" id="Ts">Ts</button>
                <button type="button" class="Noble gas" id="Og">Og</button>
            </div>
        </div>
        <div id="Lanthanide_Series" class="grid-item">
            <button type="button" id="Ce">Ce</button>
            <button type="button" id="Pr">Pr</button>
            <button type="button" id="Nd">Nd</button>
            <button type="button" id="Pm">Pm</button>
            <button type="button" id="Sm">Sm</button>
            <button type="button" id="Eu">Eu</button>
            <button type="button" id="Gd">Gd</button>
            <button type="button" id="Tb">Tb</button>
            <button type="button" id="Dy">Dy</button>
            <button type="button" id="Ho">Ho</button>
            <button type="button" id="Er">Er</button>
            <button type="button" id="Tm">Tm</button>
            <button type="button" id="Yb">Yb</button>
            <button type="button" id="Lu">Lu</button>
        </div>
        <div id="Actinide_Series" class="grid-item">
            <button type="button" id="Th">Th</button>
            <button type="button" id="Pa">Pa</button>
            <button type="button" id="U">U</button>
            <button type="button" id="Np">Np</button>
            <button type="button" id="Pu">Pu</button>
            <button type="button" id="Am">Am</button>
            <button type="button" id="Cm">Cm</button>
            <button type="button" id="Bk">Bk</button>
            <button type="button" id="Cf">Cf</button>
            <button type="button" id="Es">Es</button>
            <button type="button" id="Fm">Fm</button>
            <button type="button" id="Md">Md</button>
            <button type="button" id="No">No</button>
            <button type="button" id="Lr">Lr</button>
        </div>
    </div>
</body>
</html>
